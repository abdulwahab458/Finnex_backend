spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite


app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    issuer: smart-finance-api

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}


stock:
  api:
    key: ${FINNHUB_API_KEY}
    base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}


alphavantagestock:
  alpha-vantage:
    base-url: ${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
    key: ${ALPHA_VANTAGE_API_KEY}


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}